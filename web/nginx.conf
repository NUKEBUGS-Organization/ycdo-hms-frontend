server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # CapRover/Docker embedded DNS — resolve at request time so nginx starts
  # even if the API app is briefly unreachable.
  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # Proxy to API on container port 80 (must match CapRover Container HTTP Port).
  # Variable + resolver avoids startup DNS failure; full /api/... URI is preserved.
  # ${DOLLAR} → $ after envsubst
  location /api/ {
    proxy_http_version 1.1;
    set ${DOLLAR}api_upstream "${API_UPSTREAM}";
    proxy_pass ${DOLLAR}api_upstream;
    proxy_set_header Host ${DOLLAR}host;
    proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
    proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location /assets/ {
    try_files ${DOLLAR}uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files ${DOLLAR}uri ${DOLLAR}uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
